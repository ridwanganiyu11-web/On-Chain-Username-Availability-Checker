<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="emeraldCyan" x1="96" y1="80" x2="416" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="url(#emeraldCyan)" stroke-opacity="0.25" stroke-width="4" />

  <!-- Outer Hexagonal On-Chain Ring -->
  <polygon
    points="256,64 422,160 422,352 256,448 90,352 90,160"
    stroke="url(#emeraldCyan)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#10B981"
    fill-opacity="0.06"
    filter="url(#glow)"
  />

  <!-- Stylized @ Identity Core -->
  <path
    d="M312 256C312 286.928 286.928 312 256 312C225.072 312 200 286.928 200 256C200 225.072 225.072 200 256 200C286.928 200 312 225.072 312 256ZM312 256V280C312 299.882 328.118 316 348 316C367.882 316 384 299.882 384 280V256C384 185.308 326.692 128 256 128C185.308 128 128 185.308 128 256C128 326.692 185.308 384 256 384H332"
    stroke="url(#emeraldCyan)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Node Connection Dots -->
  <circle cx="256" cy="64" r="14" fill="#34D399" />
  <circle cx="422" cy="160" r="14" fill="#10B981" />
  <circle cx="90" cy="352" r="14" fill="#06B6D4" />
  <circle cx="332" cy="384" r="14" fill="#34D399" />
</svg>
